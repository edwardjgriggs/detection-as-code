# pySigma processing pipeline for Microsoft Sentinel.
#
# Each rule's logsource selects the Log Analytics table the converted query
# runs against. The kusto backend only prepends a table when one of its bundled
# pipelines is used, so the postprocessing template at the bottom does it for
# this custom pipeline. Add a new set_state block when a rule introduces a new
# logsource, otherwise conversion fails on the missing query_table state.

name: sentinel-pipeline
priority: 100

transformations:
  - id: signin-table
    type: set_state
    key: query_table
    val: SigninLogs
    rule_conditions:
      - type: logsource
        product: azure
        service: signinlogs

  - id: audit-table
    type: set_state
    key: query_table
    val: AuditLogs
    rule_conditions:
      - type: logsource
        product: azure
        service: auditlogs

  - id: office-table
    type: set_state
    key: query_table
    val: OfficeActivity
    rule_conditions:
      - type: logsource
        product: m365
        service: exchange

postprocessing:
  - type: simple_template
    template: "{pipeline.state[query_table]}\n| where {query}"
